{% extends 'subscriptions/main.html' %}

{% block content %}

<div class="auth-page">

    <form method="POST" class="subscription-form">

        {% csrf_token %}

        <div class="form-mark">
            +
        </div>

        <h1>Add subscription</h1>

        <p class="form-subtitle">
            Add a subscription to start tracking your spending.
        </p>


        <div class="form-field">

            <label for="merchant">
                Merchant
            </label>

            <input
                type="text"
                id="merchant"
                name="merchant"
                placeholder="Netflix"
                required
            >

        </div>


        <div class="form-row">

            <div class="form-field">

                <label for="amount">
                    Amount
                </label>

                <input
                    type="number"
                    id="amount"
                    name="amount"
                    placeholder="22.99"
                    step="0.01"
                    min="0"
                    required
                >

            </div>


            <div class="form-field">

                <label for="date_due">
                    Next payment
                </label>

                <input
                    type="date"
                    id="date_due"
                    name="date_due"
                    required
                >

            </div>

        </div>


        <div class="form-field">

            <label for="billing_period">
                Billing period
            </label>

            <select
                id="billing_period"
                name="billing_period"
                required
            >

                <option value="" disabled selected>
                    Select billing period
                </option>

                <option value="weekly">
                    Weekly
                </option>

                <option value="monthly">
                    Monthly
                </option>

                <option value="yearly">
                    Yearly
                </option>

            </select>

        </div>


        <div class="form-field">

            <label for="category">
                Category
            </label>

            <select
                id="category"
                name="category"
                required
            >

                <option value="" disabled selected>
                    Select category
                </option>

                <option value="entertainment">
                    Entertainment
                </option>

                <option value="software">
                    Software
                </option>

                <option value="music">
                    Music
                </option>

                <option value="gaming">
                    Gaming
                </option>

                <option value="education">
                    Education
                </option>

                <option value="fitness">
                    Fitness
                </option>

                <option value="shopping">
                    Shopping
                </option>

                <option value="other">
                    Other
                </option>

            </select>

        </div>


        <button
            type="submit"
            class="subscription-submit"
        >
            Add subscription
        </button>


        {% if error %}

            <p class="form-error">
                {{ error }}
            </p>

        {% endif %}


        <a
            href="{% url 'dashboard' %}"
            class="cancel-link"
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}
